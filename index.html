<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ticket">
<title>Ticket Unitaire (démo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap">
<style>
:root{--page:#e9e4dc;--card:#fff;--head:#f1c3ce;--edge:#d4163f;--ink:#222;--ok:#3d9a0b;--bad:#d4163f;--pink:#efb8d9;--blue:#14a8ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14110e}}
:root[data-theme="dark"]{--page:#14110e}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{position:fixed;top:0;bottom:0;left:50%;width:min(100%,430px);transform:translateX(-50%);background-size:cover;background-position:center top}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;container-type:inline-size;overflow-y:auto}
.in{position:relative;touch-action:none;min-height:100%;display:flex;flex-direction:column;padding:0 4cqw 4cqw;box-sizing:border-box}
.back{position:absolute;left:2.6cqw;top:4cqw;width:10.3cqw;aspect-ratio:1;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;z-index:2;padding:0;color:#111}
.back svg{width:5cqw;height:5cqw}
.stage{position:relative;width:49.6cqw;aspect-ratio:1;margin:28cqw auto 0}
.logo{position:absolute;inset:0;border-radius:50%;background:#fff;display:grid;place-items:center}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.ph{font-size:3.6cqw;font-weight:600;color:#999}
.orb{position:absolute;pointer-events:none;left:0;top:0;width:25.8%;aspect-ratio:1;border-radius:50%;will-change:transform}
.orb.p{background:var(--pink)}.orb.b{background:var(--blue)}
.cards{margin-top:auto;display:flex;flex-direction:column;gap:1.8cqw}
.card{background:var(--card);border:.3cqw solid var(--edge);border-radius:3cqw;overflow:hidden}
.card header{display:flex;justify-content:space-between;align-items:stretch;background:var(--head)}
.card h2{margin:0;align-self:center;padding:0 2.4cqw;font-size:4.3cqw;font-weight:600}
.tab{background:var(--card);border-radius:0 0 3cqw 0;padding:1.4cqw 3.2cqw;display:flex;align-items:center;gap:1.6cqw;font-size:4.8cqw;font-weight:800}
.ic{width:6.4cqw;height:6.4cqw;flex:none}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.body{display:flex;align-items:center;justify-content:space-between;padding:2cqw 2.5cqw}
.lbl{margin:0 0 .6cqw;font-size:3.3cqw}
.row{margin:0;display:flex;align-items:center;gap:1.6cqw;font-size:3.9cqw;font-weight:500;line-height:1.7}
.row.b{font-weight:600}
.qrwrap{border-left:.25cqw solid var(--edge);padding:0 0 0 3.2cqw;margin-left:2cqw}
#qr{width:12.6cqw;aspect-ratio:1;border:.25cqw solid #222;border-radius:1cqw;padding:.7cqw;box-sizing:border-box;background:#fff}
#qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
#qr canvas{display:none!important}
.ctl{display:flex;flex-direction:column;align-items:center;padding:1.6cqw 2cqw 2.2cqw}
.ctl .row{font-size:3.9cqw}
.tid{margin:0;font-size:5.5cqw;font-weight:800;letter-spacing:.01em}
#timer{color:var(--ok)}
.bar{margin-top:2.6cqw;height:6.6cqw;border-radius:99px;background:#fff;border:.25cqw solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;width:1.2%;background:var(--ok);border-radius:99px;transition:width 1s linear}
</style>
</head>

<div class="app"><div class="in">
  <button class="back" id="reset" aria-label="Nouveau ticket de démonstration">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
  </button>

  <div class="stage" id="stage">
    <div class="logo">
      <!-- LOGO : mets ton image dans le même dossier sous le nom tiltlogo.png -->
      <img id="logoimg" src="tiltlogo.png" alt="Logo">
    </div>
    <div class="orb p" id="o1"></div>
    <div class="orb b" id="o2"></div>
  </div>

  <div class="cards">
    <section class="card">
      <header>
        <span class="tab"><svg class="ic bad"><use href="#pers"/></svg>1</span>
        <h2>Ticket Unitaire</h2>
      </header>
      <div class="body">
        <div>
          <p class="lbl">Période de validité</p>
          <p class="row"><svg class="ic ok"><use href="#calok"/></svg><span id="d1"></span></p>
          <p class="row b"><svg class="ic bad"><use href="#calx"/></svg><span id="d2"></span></p>
        </div>
        <div class="qrwrap"><div id="qr"></div></div>
      </div>
    </section>

    <section class="card">
      <header>
        <span class="tab" id="timer">00:00</span>
        <h2>Informations de contrôle</h2>
      </header>
      <div class="ctl">
        <p class="row"><svg class="ic ok"><use href="#calok"/></svg><span id="d3"></span></p>
        <p class="tid" id="tid"></p>
      </div>
    </section>

    <div class="bar" role="progressbar" aria-label="Temps de validité écoulé"><i id="fill"></i></div>
  </div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var DUR = 3600e3; // durée de validité : 1 h
  var pad = function(n){return String(n).padStart(2,'0')};
  var fmt = function(t){var d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' à '+pad(d.getHours())+':'+pad(d.getMinutes())};

  function newTicket(){
    var b=new Uint8Array(7);crypto.getRandomValues(b);
    var h=Array.prototype.map.call(b,function(x){return x.toString(16).padStart(2,'0')}).join('').toUpperCase().slice(0,13);
    return {id:'176-'+h,start:Date.now()};
  }
  var tk=newTicket(); // début = heure réelle à l’ouverture, fin = +1 h

  var end=tk.start+DUR;
  document.getElementById('d1').textContent=fmt(tk.start);
  document.getElementById('d2').textContent=fmt(end);
  document.getElementById('d3').textContent=fmt(tk.start);
  document.getElementById('tid').textContent=tk.id;

  if(window.QRCode){
    new QRCode(document.getElementById('qr'),{text:'DEMO|'+tk.id+'|'+new Date(tk.start).toISOString()+'|'+new Date(end).toISOString(),width:128,height:128,correctLevel:QRCode.CorrectLevel.M});
  }

  // Compteur de contrôle + barre de progression
  var opened=Date.now(),timer=document.getElementById('timer'),fill=document.getElementById('fill');
  function tick(){
    var s=Math.floor((Date.now()-opened)/1000);
    timer.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    fill.style.width=Math.min(100,Math.max(1.2,(Date.now()-tk.start)/DUR*100))+'%';
  }
  tick();setInterval(tick,1000);

  // Pastilles animées (preuve que ce n'est pas une capture d'écran)
  var stage=document.getElementById('stage'),o1=document.getElementById('o1'),o2=document.getElementById('o2');
  var touch=null,cx=0,cy=0,cr=0,ready=false,ang=0,last=0;
  function place(el,x,y){var d=el.offsetWidth;el.style.transform='translate('+(x-d/2)+'px,'+(y-d/2)+'px)'}
  function frame(t){
    var w=stage.clientWidth,dt=Math.min(.05,(t-last)/1000);last=t;
    var tx=w/2,ty=w/2,tr=w/2; // repos : sur le bord du cercle, face à face
    if(touch){tx=touch.x;ty=touch.y;tr=w*0.2}
    if(!ready){cx=tx;cy=ty;cr=tr;ready=true}
    var k=1-Math.exp(-dt*10);
    cx+=(tx-cx)*k;cy+=(ty-cy)*k;cr+=(tr-cr)*k;
    ang+=dt*(touch?3.2:1.2);
    place(o1,cx+Math.cos(ang)*cr,cy+Math.sin(ang)*cr);
    place(o2,cx-Math.cos(ang)*cr,cy-Math.sin(ang)*cr);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var app=document.querySelector('.app');
  function pos(e){var r=stage.getBoundingClientRect();touch={x:e.clientX-r.left,y:e.clientY-r.top}}
  app.addEventListener('pointerdown',function(e){if(e.target.closest('#reset'))return;pos(e)});
  app.addEventListener('pointermove',function(e){if(touch)pos(e)});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){app.addEventListener(n,function(){touch=null})});

  // Logo : si exemple.jpg est introuvable, on affiche un repère
  var img=document.getElementById('logoimg');
  function ph(){var s=document.createElement('span');s.className='ph';s.textContent='tiltlogo.png';img.replaceWith(s)}
  img.addEventListener('error',ph);
  if(img.complete&&img.naturalWidth===0)ph();

  // Bouton retour : génère un nouveau ticket de démonstration
  document.getElementById('reset').addEventListener('click',function(){
    try{localStorage.removeItem('tk')}catch(e){}
    location.reload();
  });
})();
</script>
</body>
</html>
